<div class="p-4 md:p-6">
  <div class="mb-6">
    <div class="flex flex-col gap-3 mb-3">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <h3
          class="text-sm lg:text-lg font-bold mb-1 border-b text-navy text-center"
        >
          Personnel Forms
        </h3>
        <div class="flex items-center gap-3">
          <span
            class="text-sm md:text-lg text-blue-900/50 font-bold"
            id="verifiedCount"
          ></span>
          <button
            id="printFormListingBtn"
            type="button"
            onclick="generateFormListingReport()"
            class="inline-flex items-center gap-2 px-4 py-2 bg-navy text-white text-xs md:text-sm font-bold rounded-lg border border-navy hover:bg-navy transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-30 disabled:cursor-not-allowed"
            aria-label="Print the personnel forms matching the selected filters"
          >
            <i class="fas fa-print" aria-hidden="true"></i>
            <span>Print Report</span>
          </button>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap flex-1 min-w-[280px]">
        <div class="relative flex-1 min-w-[200px] max-w-sm">
          <i
            class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-navy/30 text-xs"
          ></i>
          <input
            type="text"
            id="filterSearch"
            oninput="onSearchInput()"
            placeholder="Search name or service no..."
            class="w-full text-xs border border-amber-100 rounded-lg pl-9 pr-3 py-2 bg-white text-navy focus:outline-none focus:border-navy"
          />
        </div>
        <select
          id="filterShip"
          onchange="applyFilters()"
          class="text-xs border border-amber-100 rounded-lg px-3 py-1.5 bg-white text-navy focus:outline-none focus:border-navy"
        >
          <option value="">All Ships</option>
        </select>
        <select
          id="filterClass"
          onchange="applyFilters()"
          class="text-xs border border-amber-100 rounded-lg px-3 py-1.5 bg-white text-navy focus:outline-none focus:border-navy"
        >
          <option value="">All Classes</option>
          <option value="1">Officers</option>
          <option value="2">Warrant Officers</option>
          <option value="3">Ratings A</option>
          <option value="4">Ratings B</option>
          <option value="5">Ratings C</option>
          <option value="6">Trainees</option>
        </select>
        <select
          id="filterStatus"
          onchange="applyFilters()"
          class="text-xs border border-amber-100 rounded-lg px-3 py-1.5 bg-white text-navy focus:outline-none focus:border-navy"
        >
          <option value="">All Statuses</option>
          <option value="NotFilled">Not Filled</option>
          <!-- Value is the real Status code "FO", labeled "Submitted" —
               the backend auto-advances every submission straight past
               the DO-review stage, so nothing ever sits at Status='Filled'
               in practice. Masking that here so the admin sees "Submitted"
               rather than a misleading "DO Reviewed". -->
          <option value="FO">Submitted</option>
          <option value="CPO">FO Approved</option>
          <option value="Verified">Confirmed</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>
    <p class="text-sm text-blue-900/50">
      Review forms across all approval stages before syncing to payroll
    </p>
  </div>

  <script>
    const ITEMS_PER_PAGE = 50;

    // Status code → badge color classes
    // NOTE: "FO" is displayed as if it were the "Submitted" stage (amber),
    // not "DO Reviewed" (its literal meaning) — see STATUS_LBL below for why.
    const STATUS_CLS = {
      Filled: "bg-amber-50 text-amber-600",
      FO: "bg-amber-50 text-amber-600",
      CPO: "bg-purple-50 text-purple-600",
      Verified: "bg-green-50 text-green-600",
    };

    // Status code → human-readable label
    // The backend auto-advances every submission straight from NULL to
    // Status='FO', skipping the DO-review step entirely (intentional,
    // left as-is on the backend). In practice nothing ever sits at
    // Status='Filled', so we mask 'FO' as "Submitted" here rather than
    // show admins a "DO Reviewed" label that doesn't reflect what
    // actually happened to the form.
    const STATUS_LBL = {
      Filled: "Submitted",
      FO: "Submitted",
      CPO: "FO Approved",
      Verified: "Confirmed",
    };

    // Status code → icon
    const STATUS_ICON = {
      Filled: "fa-file",
      FO: "fa-file",
      CPO: "fa-check",
      Verified: "fa-certificate",
    };

    const verifiedState = {
      page: 1,
      pageSize: ITEMS_PER_PAGE,
      total: 0,
      totalPages: 1,
      data: [],
      selected: new Set(),
      pendingReject: null,
      currentDetail: null,
      currentDetailTab: "form",
      search: "",
    };

    let searchDebounceTimer = null;
    let formListingBlob = null;
    let formListingBlobUrl = null;

    // ── Debounced search input ──
    function onSearchInput() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        verifiedState.search = document
          .getElementById("filterSearch")
          .value.trim();
        loadVerifiedForms(1);
      }, 350);
    }

    // ── Apply filters (reset to page 1) ──
    function applyFilters() {
      loadVerifiedForms(1);
    }

    // Build one shared filter set for both the on-screen list and the report.
    // The report request intentionally does not add pagination parameters.
    function buildVerifiedFilterParams(includeSearchLabel = false) {
      const ship = document.getElementById("filterShip")?.value || "";
      const cls = document.getElementById("filterClass")?.value || "";
      const status = document.getElementById("filterStatus")?.value || "";
      const search =
        document.getElementById("filterSearch")?.value.trim() || "";
      const params = new URLSearchParams();

      verifiedState.search = search;
      if (ship) params.set("ship", ship);
      if (cls) params.set("payrollclass", cls);
      if (status) params.set("status", status);
      if (search) {
        // One term, matched against the name columns AND the service number
        // by the backend — NN/0001, NN0001 and 000001 all resolve to the
        // same person, so no client-side guessing is needed any more.
        params.set("q", search);
        if (includeSearchLabel) params.set("search", search);
      }

      return params;
    }

    // ── Populate ship dropdown ──
    (function () {
      fetch("/admin/ships", { headers: { Authorization: "Bearer " + token } })
        .then((r) => (r.ok ? r.json() : []))
        .then((ships) => {
          const sel = document.getElementById("filterShip");
          ships.forEach((s) => {
            const name = s.name || s.ship_name || s.shipName || "";
            const opt = document.createElement("option");
            opt.value = name;
            opt.textContent = name + " -- " + (s.code ? ` [${s.code}]` : "");
            sel.appendChild(opt);
          });
          const sorted = [...sel.options]
            .slice(1)
            .sort((a, b) =>
              a.textContent.trim().localeCompare(b.textContent.trim()),
            );
          sorted.forEach((opt) => sel.appendChild(opt));
        })
        .catch(() => {});
    })();

    // ── Load forms (all statuses, filterable) ──
    function loadVerifiedForms(page = 1) {
      page = Math.max(page, 1);
      verifiedState.page = page;

      const params = buildVerifiedFilterParams();
      params.set("page", page);
      params.set("pageSize", ITEMS_PER_PAGE);

      const tbody = document.getElementById("verifiedTableBody");

      tbody.innerHTML =
        '<tr><td colspan="5" class="text-center py-12 text-navy/30"><i class="fas fa-spinner fa-spin mr-2"></i></td></tr>';

      fetch(`/admin/personnel?${params}`, {
        headers: { Authorization: "Bearer " + token },
      })
        .then((r) => (r.ok ? r.json() : Promise.reject(r)))
        .then((data) => {
          verifiedState.data = data.rows || [];
          verifiedState.total = data.pagination.total;
          verifiedState.totalPages = data.pagination.totalPages;

          document.getElementById("verifiedCount").textContent =
            `${data.pagination.total.toLocaleString()} form${data.pagination.total !== 1 ? "s" : ""}`;

          renderTable();
          updatePagination();
          // showBatchActionsIfNeeded(); // batch actions disabled
        })
        .catch((err) => {
          console.error("Error loading forms:", err);
          tbody.innerHTML =
            '<tr><td colspan="5" class="text-center py-12 text-navy/40">Failed to load forms. Please try again.</td></tr>';
        });
    }

    // ── Generate, preview, and download the filtered PDF ──
    async function generateFormListingReport() {
      clearTimeout(searchDebounceTimer);
      const button = document.getElementById("printFormListingBtn");
      const originalHTML = button.innerHTML;
      const previousSearch = verifiedState.search;
      const params = buildVerifiedFilterParams(true);

      if (previousSearch !== verifiedState.search) loadVerifiedForms(1);

      button.disabled = true;
      button.innerHTML =
        '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i><span>Preparing report…</span>';

      try {
        const response = await fetch(`/admin/form-listing/report?${params}`, {
          headers: {
            Authorization: "Bearer " + localStorage.getItem("token"),
          },
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(
            errorData.error || "Could not generate the filtered form listing.",
          );
        }

        const blob = await response.blob();
        if (formListingBlobUrl) URL.revokeObjectURL(formListingBlobUrl);
        formListingBlob = blob;
        formListingBlobUrl = URL.createObjectURL(blob);

        const previewModal = document.getElementById("formListingPreviewModal");
        if (previewModal.parentElement !== document.body) {
          document.body.appendChild(previewModal);
        }

        const iframe = document.getElementById("formListingPreviewIframe");
        iframe.removeAttribute("srcdoc");
        // Hide the PDF viewer's built-in toolbar; the modal supplies one Download PDF action.
        iframe.src = formListingBlobUrl + "#toolbar=0";
        previewModal.classList.remove("hidden");
      } catch (error) {
        console.error("Error generating form-listing report:", error);
        showToast(
          "✗ " + (error.message || "Failed to generate report"),
          "bg-red-100 text-red-700",
        );
      } finally {
        button.disabled = false;
        button.innerHTML = originalHTML;
      }
    }

    function closeFormListingPreview() {
      document
        .getElementById("formListingPreviewModal")
        .classList.add("hidden");
      const iframe = document.getElementById("formListingPreviewIframe");
      iframe.src = "about:blank";
      iframe.removeAttribute("srcdoc");

      if (formListingBlobUrl) {
        URL.revokeObjectURL(formListingBlobUrl);
        formListingBlobUrl = null;
      }
      formListingBlob = null;
    }

    function downloadCurrentFormListing() {
      if (!formListingBlob) return;

      const url = URL.createObjectURL(formListingBlob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `form-listing-${new Date().toISOString().slice(0, 10)}.pdf`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── Render table ──
    function renderTable() {
      const tbody = document.getElementById("verifiedTableBody");
      const { data } = verifiedState;

      if (!data.length) {
        tbody.innerHTML = `
      <tr>
        <td colspan="5" class="text-center py-16 text-blue-900/30">
          <i class="fas fa-inbox fa-2x mb-3 block text-navy/20"></i>
          <p class="font-semibold">No forms found</p>
        </td>
      </tr>`;
        return;
      }

      tbody.innerHTML = data
        .map((row) => {
          const name = `${row.Surname || ""} ${row.OtherName || ""}`.trim();
          const cls = STATUS_CLS[row.Status] || "bg-gray-100 text-gray-500";
          const lbl =
            STATUS_LBL[row.Status] ||
            (row.emolumentform === "Yes" ? "Completed" : "Not Filed");
          const icon = row.Status
            ? STATUS_ICON[row.Status] || "fa-circle"
            : row.emolumentform === "Yes"
              ? "fa-check-circle"
              : "fa-exclamation-circle";
          const badgeCls = row.Status
            ? cls
            : row.emolumentform === "Yes"
              ? "bg-green-50 text-green-600"
              : "bg-red-50 text-red-400";

          return `
        <tr class="border-b border-amber-50 hover:bg-amber-50/40 transition-colors">
          <td class="px-3 py-3 font-bold text-navy">${name}</td>
          <td class="px-3 py-3 font-mono text-xs text-blue-900/60">${row.serviceNumber}</td>
          <td class="px-3 py-3 text-navy/70">${row.Rank}</td>
          <td class="px-3 py-3 text-navy/70">${row.ship || "N/A"}</td>
          <td class="px-3 py-3">
            <span class="px-2 py-1 ${badgeCls} text-xs font-semibold rounded-lg whitespace-nowrap">
              <i class="fas ${icon} mr-1"></i>${lbl}
            </span>
          </td>
          <!-- Actions column commented out — no actions on this page
          <td class="px-3 py-3">
            <div class="flex justify-end gap-2">
              <button onclick="viewForm('${row.form_id}', '${row.serviceNumber}')"
                class="px-3 py-1.5 bg-navy/10 text-navy text-xs font-bold rounded-lg hover:bg-navy/20 transition-colors cursor-pointer border-none flex items-center gap-1">
                <i class="fas fa-eye"></i>View
              </button>
              <button onclick="openRejectModal('${row.formNumber}', '${name}')"
                class="px-3 py-1.5 bg-red-100 text-red-600 text-xs font-bold rounded-lg hover:bg-red-200 transition-colors cursor-pointer border-none">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </td>
          -->
        </tr>
      `;
        })
        .join("");
    }

    /* ── Selection / batch actions — disabled, no actions on this page ──
    function toggleSelect(svcno, checked) {
      checked
        ? verifiedState.selected.add(svcno)
        : verifiedState.selected.delete(svcno);
      updateBatchActionsBar();
    }

    function toggleSelectAll(checked) {
      if (checked) {

    // ── Pagination ──
    function updatePagination() {
      const { page, totalPages, total } = verifiedState;

      document.getElementById("pageInfo").textContent =
        `Page ${page} of ${totalPages} (${total.toLocaleString()} total)`;
      document.getElementById("prevBtn").disabled = page === 1;
      document.getElementById("nextBtn").disabled = page === totalPages;

      document
        .getElementById("verifiedPagination")
        .classList.toggle("hidden", totalPages <= 1);
    }

    // ── Toast ──
    function showToast(msg, classes) {
      const toast = document.createElement("div");
      toast.className = `fixed bottom-4 right-4 px-4 py-3 rounded-lg font-semibold text-sm shadow-lg ${classes}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
