<style>
  .pr-lbl {
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(30, 64, 175, 0.42);
    margin: 0 0 0.45rem;
  }

  /* ── Summary stats row ── */
  .pr-stats-grid {
    /*display: grid;*/
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.75rem;
    align-items: center;
  }

  @media (max-width: 540px) {
    .pr-stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }
  }

  .pr-stat-card {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    padding: 0.35rem 0;
    border: none;
    border-bottom: 1px solid rgba(30, 64, 175, 0.08);

  }

    font-size: 0.63rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: rgba(30, 64, 175, 0.48);

    white-space: nowrap;

  .pr-stat-val {

    font-weight: 900;
    line-height: 1;
    color: rgb(30 64 175);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .pr-stat-sub {
    display: none;
  }

  /* ── Filters row ── */
  .pr-filters {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    flex-wrap: wrap;
  }

  .pr-input {
    flex: 1;
    min-width: 140px;
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 0.5rem;

    font-size: 0.8rem;

  .pr-input:focus {
    border-color: rgb(30 64 175);

  .pr-select {
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 0.5rem;
    padding: 0.45rem 0.6rem;

    cursor: pointer;

    padding: 0.45rem 0.75rem;
    background: #f3f4f6;
    color: rgba(30, 64, 175, 0.5);

    background: #e5e7eb;
  }

  .pr-table-wrap {
    overflow-x: auto;
  }

  .pr-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }

  .pr-table thead tr {
    border-bottom: 2px solid rgba(251, 191, 36, 0.25);
  }

  .pr-table th {
    text-align: left;
    padding: 0.5rem 0.5rem;
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: rgba(30, 64, 175, 0.45);
    white-space: nowrap;
  }

  .pr-table td {
    padding: 0.5rem 0.5rem;
    color: rgba(30, 64, 175, 0.7);
    border-bottom: 1px solid rgba(251, 191, 36, 0.1);
    white-space: nowrap;
  }

  .pr-table tbody tr:hover {
    background: rgba(251, 191, 36, 0.05);
  }

  .pr-table tbody tr:last-child td {
    border-bottom: none;
  }

  .pr-table td.ship-name {
    font-weight: 700;
    color: rgb(30 64 175);
  }

  .pr-table td.num {
    text-align: right;
    font-weight: 700;
    color: rgb(30 64 175);
  }

  .pr-table td.num-muted {
    text-align: right;
    color: rgba(30, 64, 175, 0.55);
    font-weight: 600;
  }

  /* Completion % badge */
  .pr-pct {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    min-width: 42px;
    text-align: center;
  }

  .pr-pct-green {
    background: rgba(34, 197, 94, 0.12);
    color: #166534;
  }

  .pr-pct-amber {
    background: rgba(245, 158, 11, 0.12);
    color: #92400e;
  }

  .pr-pct-red {
    background: rgba(239, 68, 68, 0.1);
    color: #991b1b;
  }

  /* Not filed badge */
  .pr-nf {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(239, 68, 68, 0.08);
    color: #991b1b;
  }

  /* ── Pagination ── */
  .pr-pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.75rem;
  }

  .pr-pg-btn {
    padding: 0.3rem 0.75rem;
    font-size: 0.7rem;
    font-weight: 700;
    color: rgb(30 64 175);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 0.5rem;
    background: rgba(255, 255, 255, 0.6);
    cursor: pointer;
    transition: background 0.15s;
  }

  .pr-pg-btn:hover:not(:disabled) {
    background: rgba(251, 191, 36, 0.08);
  }

  .pr-pg-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .pr-pg-info {
    font-size: 0.65rem;
    color: rgba(30, 64, 175, 0.4);
    font-weight: 600;
  }

  /* ── Skeleton ── */
  .pr-sk {
    display: inline-block;
    background: rgba(251, 191, 36, 0.18);
    border-radius: 0.25rem;
    animation: pr-pulse 1.4s ease-in-out infinite;
  }

  @keyframes pr-pulse {

    0%,
    100% {
      opacity: 1
    }

    50% {
      opacity: 0.4
    }
  }

  .pr-empty {
    text-align: center;
    padding: 2rem 0;
    font-size: 0.8rem;
    color: rgba(30, 64, 175, 0.3);
  }
</style>

<script>
  (function () {
    const TOKEN = localStorage.getItem('token');
    const PAGE_SIZE = 10;

    let _allShips = [];   // flat list of all ship rows (from all commands)
    let _filtered = [];   // after search + command filter
    let _page = 1;
    let _reportBlob = null;
    let _reportBlobUrl = null;

    function N(v) { return (!v && v !== 0) ? '0' : Number(v).toLocaleString(); }

    /* ── Load data ── */
    function load() {
      if (!TOKEN) return;
      fetch('/reports/progress', { headers: { Authorization: 'Bearer ' + TOKEN } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (res) {
          if (!res) return;
          /* Route does res.json(result.data) — handle both shapes */
          const payload = (res.commands !== undefined) ? res : (res.data || null);
          if (payload) render(payload);
        })
        .catch(function () {
          document.getElementById('pr-table-wrap').innerHTML =
            '<div class="pr-empty" style="color:#f87171;">Failed to load report</div>';
        });
    }

    /* ── Render ── */
    function render(data) {
      const commands = data.commands || [];

      /* Flatten all ships into one list, carry commandName */
      _allShips = [];
      const commandNames = [];

      commands.forEach(function (cmd) {
        if (cmd.commandName && commandNames.indexOf(cmd.commandName) === -1) {
          commandNames.push(cmd.commandName);
        }
        (cmd.ships || []).forEach(function (s) {
          _allShips.push(Object.assign({}, s, { commandName: cmd.commandName || 'Unassigned' }));
        });
      });

      /* Populate command filter */
      const sel = document.getElementById('pr-command');
      const existing = Array.from(sel.options).map(function (o) { return o.value; });
      commandNames.forEach(function (c) {
        if (existing.indexOf(c) === -1) {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          sel.appendChild(opt);
        }
      });

      /* Summary stats from all ships */
      const totShips = _allShips.length;
      const totPersonnel = _allShips.reduce(function (a, s) { return a + Number(s.total || 0); }, 0);
      const totCompleted = _allShips.reduce(function (a, s) { return a + Number(s.completed || 0); }, 0);
      const totNotFiled = _allShips.reduce(function (a, s) { return a + Number(s.not_filed || 0); }, 0);
      const overallPct = totPersonnel > 0 ? Math.round(totCompleted / totPersonnel * 100) : 0;

      document.getElementById('pr-s-ships').textContent = N(totShips);
      document.getElementById('pr-s-total').textContent = N(totPersonnel);
      document.getElementById('pr-s-completed').textContent = N(totCompleted);
      document.getElementById('pr-s-comp-pct').textContent = overallPct + '% overall';
      document.getElementById('pr-s-notfiled').textContent = N(totNotFiled);

      /* Apply any active filters and render table */
      prApplyFilters();
    }

    /* ── Filter logic ── */
    window.prApplyFilters = function () {
      const q = (document.getElementById('pr-search').value || '').toLowerCase().trim();
      const command = (document.getElementById('pr-command').value || '').toLowerCase().trim();

      _filtered = _allShips.filter(function (s) {
        const matchShip = !q || (s.ship_name || '').toLowerCase().includes(q);
        const matchCommand = !command || (s.commandName || '').toLowerCase() === command;
        return matchShip && matchCommand;
      });

      _page = 1;
      renderTable();
    };

    window.prClearFilters = function () {
      document.getElementById('pr-search').value = '';
      document.getElementById('pr-command').value = '';
      prApplyFilters();
    };

    /* ── Table render ── */
    function renderTable() {
      const wrap = document.getElementById('pr-table-wrap');
      const countEl = document.getElementById('pr-count');
      const total = _filtered.length;

      if (countEl) countEl.textContent = total.toLocaleString() + ' ship(s)';

      if (!total) {
        wrap.innerHTML = '<div class="pr-empty">No ships found</div>';
        document.getElementById('pr-pagination').classList.add('hidden');
        return;
      }

      const totalPages = Math.ceil(total / PAGE_SIZE);
      const start = (_page - 1) * PAGE_SIZE;
      const pageRows = _filtered.slice(start, start + PAGE_SIZE);

      wrap.innerHTML =
        '<table class="pr-table">' +
        '<thead><tr>' +
        '<th>Ship Name</th>' +
        '<th>Command</th>' +
        '<th style="text-align:right">Total</th>' +
        '<th style="text-align:right">Filled</th>' +
        // '<th style="text-align:right">DO Reviewed</th>' +
        '<th style="text-align:right">FO Approved</th>' +
        '<th style="text-align:right">Confirmed</th>' +
        '<th style="text-align:right">Not Filed</th>' +
        '<th style="text-align:right">% Done</th>' +
        '</tr></thead>' +
        '<tbody>' +
        pageRows.map(function (s) {
          const pct = s.completion_pct !== undefined
            ? parseFloat(s.completion_pct)
            : (s.total > 0 ? Math.round(s.completed / s.total * 100) : 0);
          const pctCls = pct >= 75 ? 'pr-pct-green' : pct >= 40 ? 'pr-pct-amber' : 'pr-pct-red';
          return '<tr>' +
            '<td class="ship-name">' + (s.ship_name || '—') + '</td>' +
            '<td style="color:rgba(30,64,175,0.45);font-size:0.65rem;">' + (s.commandName || '—') + '</td>' +
            '<td class="num">' + N(s.total) + '</td>' +
            '<td class="num-muted">' + N(s.submitted) + '</td>' +
            // '<td class="num-muted">' + N(s.do_reviewed) + '</td>' +
            '<td class="num-muted">' + N(s.fo_approved) + '</td>' +
            '<td class="num" style="color:#166534;">' + N(s.cpo_confirmed) + '</td>' +
            '<td class="num"><span class="pr-nf">' + N(s.not_filed) + '</span></td>' +
            '<td style="text-align:right;"><span class="pr-pct ' + pctCls + '">' + pct + '%</span></td>' +
            '</tr>';
        }).join('') +
        '</tbody>' +
        '</table>';

      /* Pagination controls */
      const pgEl = document.getElementById('pr-pagination');
      const pgInfo = document.getElementById('pr-pg-info');
      const prev = document.getElementById('pr-prev');
      const next = document.getElementById('pr-next');

      if (totalPages > 1) {
        pgEl.classList.remove('hidden');
        if (pgInfo) pgInfo.textContent = 'Page ' + _page + ' of ' + totalPages;
        if (prev) prev.disabled = (_page <= 1);
        if (next) next.disabled = (_page >= totalPages);
      } else {
        pgEl.classList.add('hidden');
      }
    }

    /* ── Page change ── */
    window.prChangePage = function (dir) {
      const totalPages = Math.ceil(_filtered.length / PAGE_SIZE);
      _page = Math.max(1, Math.min(totalPages, _page + dir));
      renderTable();
    };

    /* ── Generate and preview the filtered PDF report ── */
    window.prGenerateReport = async function () {
      if (!_allShips.length) {
        alert('Load the progress report first.');
        return;
      }
      if (!_filtered.length) {
        alert('No ships match the current filters.');
        return;
      }

      const button = document.getElementById('pr-export-btn');
      const originalHTML = button.innerHTML;
      const params = new URLSearchParams();
      const search = (document.getElementById('pr-search').value || '').trim();
      const command = (document.getElementById('pr-command').value || '').trim();
      if (search) params.set('search', search);
      if (command) params.set('command', command);

      button.disabled = true;
      button.innerHTML = '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Preparing report…';

      try {
        const response = await fetch('/reports/progress/export?' + params.toString(), {
          headers: { Authorization: 'Bearer ' + TOKEN },
        });
        if (!response.ok) {
          const errorData = await response.json().catch(function () { return {}; });
          throw new Error(errorData.error || 'Could not generate the progress report.');
        }

        const blob = await response.blob();
        if (_reportBlobUrl) URL.revokeObjectURL(_reportBlobUrl);
        _reportBlob = blob;
        _reportBlobUrl = URL.createObjectURL(blob);

        const modal = document.getElementById('pr-report-preview-modal');
        if (modal.parentElement !== document.body) document.body.appendChild(modal);
        const iframe = document.getElementById('pr-report-preview-iframe');
        iframe.removeAttribute('srcdoc');
        iframe.src = _reportBlobUrl + '#toolbar=0';
        modal.classList.remove('hidden');
      } catch (error) {
        console.error('Error generating progress report:', error);
        alert(error.message || 'Could not generate the progress report.');
      } finally {
        button.disabled = false;
        button.innerHTML = originalHTML;
      }
    };

    window.prCloseReportPreview = function () {
      document.getElementById('pr-report-preview-modal').classList.add('hidden');
      const iframe = document.getElementById('pr-report-preview-iframe');
      iframe.src = 'about:blank';
      iframe.removeAttribute('srcdoc');
      if (_reportBlobUrl) {
        URL.revokeObjectURL(_reportBlobUrl);
        _reportBlobUrl = null;
      }
      _reportBlob = null;
    };

    window.prDownloadReport = function () {
      if (!_reportBlob) return;
      const url = URL.createObjectURL(_reportBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'progress-report-' + new Date().toISOString().slice(0, 10) + '.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };

    load();
  })();
</script>
